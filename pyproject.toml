[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jarvis-ai-assistant"
version = "1.0.0"
description = "Voice-controlled agentic AI assistant that controls your laptop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shubham"},
]

dependencies = [
    "openai>=1.30.0",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.90",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pynput>=1.7.6",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "webdriver-manager>=4.0.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
include = ["jarvis*"]
